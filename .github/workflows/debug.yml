name: Debug fetch
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          for u in "https://www.youtube.com/@paadtak/live" "https://www.youtube.com/channel/UCS40zhxggcmiYmJFtAmoHaw/live" "https://www.youtube.com/@paadtak" "https://www.youtube.com/watch?v=8NbKAmSL0DI"; do
            echo "=== $u"
            code=$(curl -sS -L --max-time 30 -A "$UA" -H "Accept-Language: en" -o p.html -w '%{http_code} %{url_effective}' "$u")
            echo "$code size=$(wc -c <p.html)"
            echo "title: $(grep -o '<title>[^<]*' p.html | head -1)"
            echo "canonical: $(grep -o '<link rel="canonical"[^>]*>' p.html | head -1)"
            for m in isLiveNow '"isLiveNow":true' ytInitialData ytInitialPlayerResponse channelMetadataRenderer UCS40zhxggcmiYmJFtAmoHaw consent '"isLive":true' LOGIN_REQUIRED 'not a bot' 'playabilityStatus'; do echo "  $m: $(grep -o -- "$m" p.html | wc -l)"; done
            grep -o '"playabilityStatus":{"status":"[A-Z_]*"[^}]\{0,200\}' p.html | head -2
          done
          echo "=== cookie SOCS/CONSENT variant"
          curl -sS -L --max-time 30 -A "$UA" -H "Accept-Language: en" -H "Cookie: SOCS=CAI; CONSENT=YES+1" -o c.html -w '%{http_code} %{url_effective}\n' "https://www.youtube.com/@paadtak/live"
          for m in '"isLiveNow":true' ytInitialData channelMetadataRenderer; do echo "  $m: $(grep -o -- "$m" c.html | wc -l)"; done
          echo "=== RSS"
          curl -sS --max-time 30 -A "$UA" "https://www.youtube.com/feeds/videos.xml?channel_id=UCS40zhxggcmiYmJFtAmoHaw" | head -c 600
          echo; echo "=== oembed"
          curl -sS --max-time 30 -A "$UA" "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=8NbKAmSL0DI&format=json" | head -c 400
